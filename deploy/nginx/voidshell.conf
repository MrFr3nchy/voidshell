# voidshell — nginx alternative to the Caddyfile at the repo root.
#
# Caddy is what the repo deploys with, and it does automatic HTTPS. This exists
# for a droplet that already runs nginx and would rather not add a second web
# server. Pick one; running both is a port fight.
#
#   sudo cp deploy/nginx/voidshell.conf /etc/nginx/sites-available/voidshell
#   sudo ln -s /etc/nginx/sites-available/voidshell /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx        # certbot rewrites this block for TLS

server {
    listen 80;
    server_name voidshell.example;

    root /var/www/voidshell;
    index index.html;

    # NOT optional, and the single most likely thing to be dropped when this
    # file is adapted. These two headers are what grant SharedArrayBuffer,
    # which is what lets the Python worker block on Atomics.wait for input().
    # Without them the shell still loads and every script still runs — but any
    # program that reads stdin reports that interactive input is unavailable,
    # which looks like a bug in the terminal rather than a missing header.
    #
    # `credentialless` rather than `require-corp`: both grant SharedArrayBuffer,
    # but require-corp hard-blocks every cross-origin asset lacking a CORP
    # header — essentially the whole web, including anything Portal frames.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Before the SPA fallback. Reversed, `try_files` answers /api/* with
    # index.html and the client sees a 200 full of HTML — which it reports as
    # "not signed in" rather than as the misconfiguration it is.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Present so a future WebSocket layer works without a debugging session.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API trusts this to rate-limit per client. Without it every
        # request looks like 127.0.0.1 and the whole internet shares one bucket.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A workspace save can be half a megabyte.
        client_max_body_size 1m;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header inside a location drops the inherited ones, so the
        # isolation headers have to be repeated here or /assets/ serves
        # without them and SharedArrayBuffer quietly stops working.
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
