name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The source guards below are literal greps, deliberately — anything
      # clever enough to be worded around is a guard people learn to word
      # around. They just run against comment-stripped source now.
      #
      # Grepping the source directly cannot tell a call from a sentence, and
      # the failure mode is worse than it sounds: the storage guard fired on a
      # comment in kernel/apiWorkspace.ts explaining why we *stopped* using
      # localStorage. A guard that fails the build for documenting the very
      # decision it exists to enforce teaches people to delete the
      # explanation, which is the opposite of what it is for.
      #
      # esbuild does the stripping because it is a real parser. No regex over
      # source can separate a mention in a comment from a call in code without
      # getting strings, template literals and regex literals wrong — and a
      # guard with subtle holes is worse than one with none.
      #
      # Comments cannot execute, so nothing is weakened: every construct that
      # could actually touch these APIs survives into the stripped output.
      - name: strip comments for the source guards
        run: |
          rm -rf /tmp/src-nc
          find packages/ui/src \( -name '*.ts' -o -name '*.tsx' \) -print0 \
            | xargs -0 -r npx esbuild \
                --outdir=/tmp/src-nc --outbase=packages/ui/src \
                --format=esm --log-level=error

      # A dashboard that lives in the browser is a dashboard that doesn't
      # follow the account, which is the entire point of the server.
      - name: no browser storage in the client
        run: |
          hits=$(grep -rn "localStorage\|sessionStorage\|indexedDB" /tmp/src-nc || true)
          if [ -n "$hits" ]; then
            echo "$hits" | sed -e 's#^/tmp/src-nc/#packages/ui/src/#' -e 's#\.js:#.ts:#'
            echo "::error::browser storage found in packages/ui/src — workspace state belongs on the server"
            exit 1
          fi

      # Every module must use the shared audio helper. Browsers cap how many
      # AudioContexts a page may hold, and the failure is silent.
      - name: audio only through blip.ts
        run: |
          hits=$(grep -rn "new AudioContext\|new webkitAudioContext" /tmp/src-nc \
                 | grep -v '^/tmp/src-nc/ui/blip\.js:' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | sed -e 's#^/tmp/src-nc/#packages/ui/src/#' -e 's#\.js:#.ts:#'
            echo "::error::a module is minting its own AudioContext — use src/ui/blip.ts"
            exit 1
          fi

      # Modules reach the kernel only through the context they are handed, so
      # the fence in caps.ts is only a fence if nothing else hands one out. A
      # module that imported the Kernel class directly would have the unfenced
      # surface and nothing would say so.
      - name: modules do not import the kernel directly
        run: |
          hits=$(grep -rn "from \"\.\./\.\./kernel/Kernel\"\|from '\.\./\.\./kernel/Kernel'" \
                 /tmp/src-nc/modules || true)
          if [ -n "$hits" ]; then
            echo "$hits" | sed -e 's#^/tmp/src-nc/#packages/ui/src/#' -e 's#\.js:#.ts:#'
            echo "::error::a module is importing Kernel directly — everything comes through ctx"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm run build

      # A stale generated file ships a module's old behaviour while the source
      # next to it says otherwise, and nothing else goes red.
      - name: stock modules are up to date
        run: |
          npx esbuild tools/emit-modules.mts --bundle --platform=node --format=esm \
            --outfile=emit.mjs --external:esbuild --log-level=error
          node emit.mjs --check

      - name: install harness deps
        run: npm i --no-save jsdom @types/jsdom

      # --external:esbuild because the TypeScript checks compile with the real
      # compiler. Bundled, its main.js loses the __dirname it uses to find its
      # own binary and the harness dies on the first transform.
      - name: smoke — client
        run: |
          npx esbuild tools/smoke.mts --bundle --platform=node --format=esm \
            --outfile=smoke.mjs --external:jsdom --external:esbuild --log-level=error
          node smoke.mjs

      # Needs no DOM at all: the capability layer wraps a context, and a
      # recording stub is a better subject than a real kernel because it can
      # assert what *didn't* reach the other side.
      - name: checks — module capabilities
        run: |
          npx esbuild tools/caps-checks.mts --bundle --platform=node --format=esm \
            --outfile=caps-checks.mjs --log-level=error
          node caps-checks.mjs

      # The flat backend is the one that can be checked at all: no WebGL means
      # jsdom can hold the whole thing. What is asserted is the *contract* —
      # snapshot round-trips, a reversible overview, and the unsupported half
      # declining the way the kernel's callers already expect.
      - name: checks — flat compositor
        run: |
          npx esbuild tools/dom-compositor-checks.mts --bundle --platform=node \
            --format=esm --outfile=dom-compositor-checks.mjs --external:jsdom \
            --log-level=error
          node dom-compositor-checks.mjs
      # The property that matters is that the text survives: a highlighter is a
      # pure re-presentation, so the concatenated textContent of what comes out
      # must equal what went in. The last block runs every source file in the
      # repository through it and asserts exactly that, which is what lets the
      # tokenizer afford to be regexes.
      - name: checks — syntax highlighter
        run: |
          npx esbuild tools/highlight-checks.mts --bundle --platform=node \
            --format=esm --outfile=highlight-checks.mjs --external:jsdom \
            --log-level=error
          node highlight-checks.mjs

      # Plain data, so no DOM at all. Most of what this asserts is not that a
      # bad file is refused but that the refusal names what was wrong: an
      # import replaces an entire workspace, which makes it the one operation
      # where "that didn't work" is an unacceptable answer.
      - name: checks — workspace file
        run: |
          npx esbuild tools/workspace-file-checks.mts --bundle --platform=node \
            --format=esm --outfile=workspace-file-checks.mjs --log-level=error
          node workspace-file-checks.mjs

      # Mostly plain data: the centroid-and-offsets arithmetic is pure and lives
      # apart from the compositor on purpose. The last block runs a real round
      # trip through the flat backend, because "the numbers are right" and "a
      # window lands where it was" are different claims.
      - name: checks — constellation layouts
        run: |
          npx esbuild tools/layout-checks.mts --bundle --platform=node \
            --format=esm --outfile=layout-checks.mjs --external:jsdom \
            --log-level=error
          node layout-checks.mjs
          
      # No DOM and no network: the fetch path is a URL parser, a size cap and a
      # set of refusals, and what is asserted is mostly that each refusal names
      # what was wrong. The fence a fetched module actually gets is checked
      # against a real kernel in the client smoke run.
      - name: checks — fetching a module
        run: |
          npx esbuild tools/fetch-module-checks.mts --bundle --platform=node \
            --format=esm --outfile=fetch-module-checks.mjs --log-level=error
          node fetch-module-checks.mjs

      - name: smoke — projects root
        run: |
          npx esbuild tools/projects-root-smoke.mts --bundle --platform=node \
            --format=esm --packages=external --outfile=pr-smoke.mjs --log-level=error
          node pr-smoke.mjs

      # Chess has a published right answer, so the move generator is checked
      # against one rather than against how it looks. The default tier is the
      # fast one; `--deep` adds the 4.9M-node run and is for when the generator
      # itself is touched.
      - name: perft — pawnageddon move generator
        run: |
          npx esbuild tools/pawnageddon-perft.mts --bundle --platform=node \
            --format=esm --packages=external --outfile=pg-perft.mjs --log-level=error
          node pg-perft.mjs

      - name: smoke — cli
        run: |
          npx esbuild tools/cli-smoke.mts --bundle --platform=node --format=esm \
            --packages=external --outfile=cli-smoke.mjs --log-level=error
          node cli-smoke.mjs

      - name: smoke — lock screen
        run: |
          npx esbuild tools/lock-smoke.mts --bundle --platform=node --format=esm \
            --outfile=lock-smoke.mjs --external:jsdom --log-level=error
          node lock-smoke.mjs

      - name: smoke — prices
        run: |
          npx esbuild tools/prices-smoke.mts --bundle --platform=node \
            --format=esm --outfile=prices-smoke.mjs --log-level=error
          node prices-smoke.mjs

      - name: smoke — stonks decision proxy
        run: |
          npx esbuild tools/stonks-smoke.mts --bundle --platform=node --format=esm \
            --packages=external --outfile=stonks-smoke.mjs --log-level=error
          node stonks-smoke.mjs

      - name: smoke — persistence
        run: |
          npx esbuild tools/persist-smoke.mts --bundle --platform=node --format=esm \
            --outfile=persist-smoke.mjs --external:jsdom --log-level=error
          node persist-smoke.mjs

      - name: smoke — api store
        run: |
          npx esbuild tools/api-smoke.mts --bundle --platform=node --format=esm \
            --packages=external --outfile=api-smoke.mjs --log-level=error
          node api-smoke.mjs

      - name: smoke — auth
        run: |
          npx esbuild tools/auth-smoke.mts --bundle --platform=node --format=esm \
            --packages=external --outfile=auth-smoke.mjs --log-level=error
          node auth-smoke.mjs

      - name: smoke — workspace
        run: |
          npx esbuild tools/workspace-smoke.mts --bundle --platform=node --format=esm \
            --packages=external --outfile=ws-smoke.mjs --log-level=error
          node ws-smoke.mjs
